# Axiom LastOS — Limine Universal Boot Configuration
# Compatible with BIOS, UEFI x86_64, VirtualBox, VMware, QEMU, Ventoy, Rufus, and Bare Metal

timeout: 3
graphics: yes
serial: yes

# Branding & Theme
menu_branding: Axiom LastOS 1.0 Titanium — Sovereign 64-Bit Microkernel
menu_color_background: 00080C14
menu_color_foreground: 00F0F6FC
menu_color_border: 0000D2FF
menu_color_highlight_background: 0000D2FF
menu_color_highlight_foreground: 00080C14
term_background: 00080C14
term_foreground: 00F0F6FC

# ── Boot Entries ────────────────────────────────────────────────────────────

/Axiom LastOS 1.0 (Cyber-Glass Desktop Mode)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    path: boot():/boot/kernel.elf
    cmdline: BOOT_MODE=desktop

/Axiom LastOS 1.0 (Live Hardware Prober & Installer)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    path: boot():/boot/kernel.elf
    cmdline: BOOT_MODE=installer

/Axiom LastOS 1.0 (Safe Mode & Diagnostic Recovery)
    protocol: limine
    kernel_path: boot():/boot/kernel.elf
    path: boot():/boot/kernel.elf
    cmdline: BOOT_MODE=safe NOMODESET=1

